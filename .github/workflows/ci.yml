name: Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked npm dependencies
        run: npm ci

      - name: Install Python parser packages
        run: python -m pip install -r skills/drawio/scripts/adapters/python/requirements.txt

      - name: Run quality gate
        run: npm run ci
        env:
          DRAWIO_TEST_PYTHON: ${{ steps.setup-python.outputs.python-path }}
